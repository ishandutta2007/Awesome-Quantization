<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="200" viewBox="0 0 800 200" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>Awesome-Quantization Banner</title>
    <defs>
        <linearGradient id="bannerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#2E3440;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#4C566A;stop-opacity:1" />
        </linearGradient>
    </defs>
    <rect width="100%" height="100%" rx="20" fill="url(#bannerGradient)" />
    
    <!-- Decorative Grid -->
    <g stroke="#88C0D0" stroke-width="1" stroke-opacity="0.1">
        <path d="M0 40 L800 40 M0 80 L800 80 M0 120 L800 120 M0 160 L800 160" />
        <path d="M40 0 L40 200 M80 0 L80 200 M120 0 L120 200 M160 0 L160 200" />
    </g>

    <!-- Text -->
    <text x="400" y="90" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="48" font-weight="bold" fill="#88C0D0">Awesome-Quantization</text>
    <text x="400" y="130" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="20" fill="#EBCB8B">Mastering Model Compression &amp; Performance</text>
    
    <!-- Abstract Quantization Symbols -->
    <circle cx="100" cy="100" r="10" fill="#BF616A" opacity="0.8" />
    <circle cx="150" cy="150" r="15" fill="#A3BE8C" opacity="0.8" />
    <circle cx="650" cy="50" r="12" fill="#B48EAD" opacity="0.8" />
    <circle cx="700" cy="120" r="8" fill="#5E81AC" opacity="0.8" />
</svg>
